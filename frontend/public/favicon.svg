<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Rim Metallic Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6E8EA"/>
      <stop offset="50%" stop-color="#9A9EAB"/>
      <stop offset="100%" stop-color="#4E5465"/>
    </linearGradient>

    <!-- Tread Pattern for Outer Edge -->
    <pattern id="treadPattern" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#1A1A1A"/>
      <path d="M 0 4 L 4 0 L 8 4 L 4 8 Z" fill="#2A2A2A"/>
    </pattern>
  </defs>

  <!-- Outer Tire Rubber -->
  <circle cx="32" cy="32" r="30" fill="#1E1E24" />
  <circle cx="32" cy="32" r="29" fill="none" stroke="#2D2D35" stroke-width="2" />

  <!-- Tread Notches / Grooves -->
  <g stroke="#111115" stroke-width="2.5" stroke-linecap="round">
    <line x1="32" y1="3" x2="32" y2="7" />
    <line x1="32" y1="57" x2="32" y2="61" />
    <line x1="3" y1="32" x2="7" y2="32" />
    <line x1="57" y1="32" x2="61" y2="32" />
    <line x1="11.5" y1="11.5" x2="14.3" y2="14.3" />
    <line x1="49.7" y1="49.7" x2="52.5" y2="52.5" />
    <line x1="11.5" y1="52.5" x2="14.3" y2="49.7" />
    <line x1="49.7" y1="14.3" x2="52.5" y2="11.5" />
  </g>

  <circle cx="32" cy="32" r="21" fill="#141418" />
  
  <circle cx="32" cy="32" r="18" fill="url(#rimGrad)" />
  <circle cx="32" cy="32" r="16" fill="#1E2026" />

  <g fill="url(#rimGrad)">
    <path d="M 32 16 L 35 27 L 29 27 Z" />
    <path d="M 32 16 L 35 27 L 29 27 Z" transform="rotate(72 32 32)" />
    <path d="M 32 16 L 35 27 L 29 27 Z" transform="rotate(144 32 32)" />
    <path d="M 32 16 L 35 27 L 29 27 Z" transform="rotate(216 32 32)" />
    <path d="M 32 16 L 35 27 L 29 27 Z" transform="rotate(288 32 32)" />
  </g>

  <circle cx="32" cy="32" r="7" fill="url(#rimGrad)" />
  <circle cx="32" cy="32" r="4" fill="#111115" />
  <circle cx="32" cy="32" r="2" fill="#717685" />
</svg>
